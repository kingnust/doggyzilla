name: dogzilla-mapping

services:
  mapping:
    image: dogzilla-mapping:humble
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        YAHBOOM_BASE_IMAGE: ${DOGZILLA_BASE_IMAGE:-dogzilla-yahboom-base:3.8-pinned}
    platform: linux/arm64
    container_name: dogzilla_mapping
    init: true
    network_mode: host
    ipc: host
    privileged: true
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/ttyAMA1:/dev/ttyAMA1
    environment:
      DISPLAY: ${DOGZILLA_DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/manual}
      DOGZILLA_USE_IMU: ${DOGZILLA_USE_IMU:-false}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./maps:/maps
      - ./logs:/logs
      - ./calibration:/calibration:ro
      - ./profiles:/profiles
    command:
      - ros2
      - launch
      - dogzilla_slam
      - full_mapping.launch.py
      - rviz:=${DOGZILLA_RVIZ:-false}
      - use_imu:=${DOGZILLA_USE_IMU:-false}
      - configuration_basename:=${DOGZILLA_CONFIGURATION_BASENAME:-dogzilla_2d.lua}
      - calibration_file:=/calibration/imu.json
    stop_signal: SIGINT
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /root/yahboomcar_ws/install/setup.bash &&
          ros2 topic list | grep -qx /scan &&
          ros2 topic list | grep -qx /map &&
          { [ "$${DOGZILLA_USE_IMU}" != true ] ||
          ros2 topic list | grep -qx /imu/data_corrected; }'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: "no"
    stdin_open: true
    tty: true

  drive:
    image: dogzilla-mapping:humble
    platform: linux/arm64
    container_name: dogzilla_drive
    init: true
    network_mode: host
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/manual}
    volumes:
      - ./logs:/logs
      - ./profiles:/profiles
    command:
      - ros2
      - run
      - dogzilla_slam
      - safe_base
      - --ros-args
      - -p
      - speed_profile:=slow
      - -p
      - posture_control_enabled:=true
    stop_signal: SIGINT
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /root/yahboomcar_ws/install/setup.bash &&
          ros2 node list | grep -qx /dogzilla_safe_base'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: "no"
    stdin_open: true
    tty: true

  navigation:
    image: dogzilla-mapping:humble
    platform: linux/arm64
    container_name: dogzilla_navigation
    init: true
    network_mode: host
    ipc: host
    privileged: true
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/ttyAMA1:/dev/ttyAMA1
    environment:
      DISPLAY: ${DOGZILLA_DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/manual}
      DOGZILLA_USE_IMU: ${DOGZILLA_USE_IMU:-false}
      DOGZILLA_USE_NAV2: ${DOGZILLA_USE_NAV2:-false}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./maps:/maps:ro
      - ./logs:/logs
      - ./calibration:/calibration:ro
      - ./profiles:/profiles
    command:
      - ros2
      - launch
      - dogzilla_slam
      - full_navigation.launch.py
      - rviz:=${DOGZILLA_RVIZ:-false}
      - use_imu:=${DOGZILLA_USE_IMU:-false}
      - use_nav2:=${DOGZILLA_USE_NAV2:-false}
      - configuration_basename:=${DOGZILLA_CONFIGURATION_BASENAME:-dogzilla_localization.lua}
      - map_yaml:=${DOGZILLA_MAP_YAML:-/maps/test1.yaml}
      - state_file:=${DOGZILLA_STATE_FILE:-/maps/test1.pbstream}
      - calibration_file:=/calibration/imu.json
    stop_signal: SIGINT
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /root/yahboomcar_ws/install/setup.bash &&
          topics="$$(ros2 topic list)" &&
          for topic in /scan /map /odom /battery_state /joint_states; do
          grep -qx "$${topic}" <<< "$${topics}" || exit 1; done &&
          { [ "$${DOGZILLA_USE_NAV2}" != true ] || {
          nodes="$$(ros2 node list)" &&
          grep -qx /planner_server <<< "$${nodes}"; }; }'
      interval: 10s
      timeout: 12s
      retries: 5
      start_period: 45s
    restart: "no"
    stdin_open: true
    tty: true

  shadow:
    image: dogzilla-mapping:humble
    platform: linux/arm64
    container_name: dogzilla_visual_shadow
    init: true
    network_mode: host
    ipc: host
    devices:
      - /dev/video0:/dev/video0
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/manual}
    volumes:
      - ./logs:/logs
      - ./calibration:/calibration:ro
    command:
      - ros2
      - launch
      - dogzilla_slam
      - visual_shadow.launch.py
      - enabled:=true
      - camera_info_url:=file:///calibration/camera.yaml
      - camera_x:=${DOGZILLA_CAMERA_X:-0.0}
      - camera_y:=${DOGZILLA_CAMERA_Y:-0.0}
      - camera_z:=${DOGZILLA_CAMERA_Z:-0.0}
      - camera_roll:=${DOGZILLA_CAMERA_ROLL:-0.0}
      - camera_pitch:=${DOGZILLA_CAMERA_PITCH:-0.0}
      - camera_yaw:=${DOGZILLA_CAMERA_YAW:-0.0}
      - database_path:=${DOGZILLA_RTABMAP_DATABASE:-/logs/rtabmap_mono_shadow.db}
    stop_signal: SIGINT
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /root/yahboomcar_ws/install/setup.bash &&
          topics="$$(ros2 topic list --no-daemon --spin-time 2)" &&
          nodes="$$(ros2 node list --no-daemon --spin-time 2)" &&
          for topic in /camera/image_rect /camera/camera_info
          /rtabmap_shadow/odom_input /rtabmap_shadow/info /scan
          /vision/status /vision/detections /vision/annotated/compressed; do
          grep -qx "$${topic}" <<< "$${topics}" || exit 1; done &&
          grep -qx /rtabmap_shadow/rtabmap_mono <<< "$${nodes}" &&
          timeout 5 ros2 topic echo /rtabmap_shadow/info
          --no-daemon --spin-time 2 --once
          --filter "m.ref_id > 0 and len(m.wm_state) > 0" >/dev/null'
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 45s
    restart: "no"

  vision:
    image: dogzilla-mapping:humble
    platform: linux/arm64
    container_name: dogzilla_vision
    init: true
    network_mode: host
    ipc: host
    devices:
      - /dev/video0:/dev/video0
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/vision}
    volumes:
      - ./logs:/logs
    command:
      - ros2
      - launch
      - dogzilla_slam
      - vision.launch.py
      - camera_enabled:=true
      - camera_info_url:=file:///tmp/dogzilla-uncalibrated.yaml
      - mode:=${DOGZILLA_VISION_MODE:-raw}
      - color:=${DOGZILLA_VISION_COLOR:-red}
      - process_hz:=${DOGZILLA_VISION_RATE:-10.0}
    stop_signal: SIGINT
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /root/yahboomcar_ws/install/setup.bash &&
          topics="$$(ros2 topic list --no-daemon --spin-time 2)" &&
          nodes="$$(ros2 node list --no-daemon --spin-time 2)" &&
          for topic in /camera/image_raw /vision/status /vision/detections
          /vision/annotated/compressed; do
          grep -qx "$${topic}" <<< "$${topics}" || exit 1; done &&
          grep -qx /dogzilla_vision <<< "$${nodes}" &&
          timeout 5 ros2 topic echo /vision/detections
          --no-daemon --spin-time 2 --once >/dev/null'
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: "no"

  vision_control:
    image: dogzilla-mapping:humble
    platform: linux/arm64
    container_name: dogzilla_vision_control
    init: true
    network_mode: host
    ipc: host
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/video0:/dev/video0
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/vision-control}
    volumes:
      - ./logs:/logs
      - ./profiles:/profiles
    command:
      - ros2
      - launch
      - dogzilla_slam
      - vision_control.launch.py
      - armed:=true
      - camera_info_url:=file:///tmp/dogzilla-uncalibrated.yaml
      - mode:=${DOGZILLA_VISION_MODE:-raw}
      - color:=${DOGZILLA_VISION_COLOR:-red}
      - process_hz:=${DOGZILLA_VISION_RATE:-10.0}
    stop_signal: SIGINT
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /root/yahboomcar_ws/install/setup.bash &&
          topics="$$(ros2 topic list --no-daemon --spin-time 2)" &&
          nodes="$$(ros2 node list --no-daemon --spin-time 2)" &&
          for topic in /camera/image_raw /vision/status /vision/detections
          /vision/annotated/compressed /vision/action_status /battery_state
          /joint_states; do
          grep -qx "$${topic}" <<< "$${topics}" || exit 1; done &&
          grep -qx /dogzilla_vision <<< "$${nodes}" &&
          grep -qx /dogzilla_safe_base <<< "$${nodes}"'
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: "no"

  web:
    image: dogzilla-mapping:humble
    platform: linux/arm64
    container_name: dogzilla_web
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
      ROS_LOG_DIR: ${DOGZILLA_ROS_LOG_DIR:-/logs/web}
      DOGZILLA_WEB_HOST: ${DOGZILLA_WEB_HOST:-0.0.0.0}
      DOGZILLA_WEB_PORT: ${DOGZILLA_WEB_PORT:-8080}
      DOGZILLA_WEB_TOKEN: ${DOGZILLA_WEB_TOKEN:-}
      DOGZILLA_WEB_MAP_NAME: ${DOGZILLA_WEB_MAP_NAME:-test1}
      DOGZILLA_WEB_MIN_BATTERY: ${DOGZILLA_WEB_MIN_BATTERY:-28}
      DOGZILLA_WEB_OCCUPIED_THRESHOLD: ${DOGZILLA_WEB_OCCUPIED_THRESHOLD:-50}
      DOGZILLA_WEB_GOAL_CLEARANCE: ${DOGZILLA_WEB_GOAL_CLEARANCE:-0.18}
      DOGZILLA_WEB_DATABASE: /data/tasks.sqlite3
    volumes:
      - ./web/data:/data
      - ./logs:/logs
    command:
      - ros2
      - run
      - dogzilla_slam
      - web_gateway
    stop_signal: SIGINT
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' +
          '$${DOGZILLA_WEB_PORT}/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
